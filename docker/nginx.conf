# =============================================================================
# Gradient — static serving.
#
# The site is fully prerendered, so this only has three jobs: resolve Astro's
# directory-style URLs, hand back the right Content-Type for the Pyodide
# assets, and cache the immutable things hard without caching the HTML.
# =============================================================================

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;

    # Astro is configured with trailingSlash: "always", so every page is
    # emitted as <path>/index.html. $uri/ is what resolves the directory form.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- Pyodide -------------------------------------------------------------
    # A browser refuses to stream-compile WebAssembly served as anything other
    # than application/wasm, so this one header is load-bearing: get it wrong
    # and every Run button fails with an opaque error. nginx 1.27's mime.types
    # does map .wasm, but stating it here means the image cannot regress if the
    # base image's map ever changes.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The wheel closure. Pyodide fetches these as ArrayBuffers, so the type is
    # immaterial, but the version-pinned path makes them safe to cache forever.
    location ~* \.(whl|zip)$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The worker loads pyodide.mjs as an ES module; a wrong type is a hard fail.
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- Hashed build output and fonts --------------------------------------
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* \.(woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- Compression ---------------------------------------------------------
    # Text only. The .wasm and .whl payloads are already compact and gzipping
    # ten megabytes per request would cost far more CPU than it saves bytes.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # No error_page directive on purpose: this Astro build emits no 404.html,
    # and pointing error_page at a file that does not exist just turns a clean
    # 404 into a confusing one. Add a src/pages/404.astro first if you want one.
}
